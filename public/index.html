<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abertura de Chamados - TI</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/png" href="img/Iconarchive-Robot-Avatar-Yellow-5-Minion.ico">

    <!-- Arquivo CSS Externo -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div style="text-align: center; margin-bottom: 15px;">
            <img src="img/logo_nre_amsul_440x78.png" alt="Logo da ams" style="max-width: 300px; height: auto;">
        </div>

        <!-- Cards de Estatísticas para o Usuário -->
        <div class="cards-indicadores">
            <div class="card aberto">
                <h4>Abertos</h4>
                <span id="cardAberto">0</span>
            </div>
            <div class="card andamento">
                <h4>Em Andamento</h4>
                <span id="cardAndamento">0</span>
            </div>
            <div class="card fechado">
                <h4>Resolvidos</h4>
                <span id="cardFechado">0</span>
            </div>
            <div class="card cancelado">
                <h4>Cancelados</h4>
                <span id="cardCancelado">0</span>
            </div>
        </div>

        <h2>Abrir Novo Chamado de TI</h2>

        <!-- Formulário de Abertura -->
        <form id="formChamado">
            <div class="form-group">
                <label for="nome">Seu Nome:</label>
                <input type="text" id="nome" required placeholder="Digite seu nome completo">
            </div>

            <div class="form-group">
                <label for="setor">Seu Setor / Departamento:</label>
                <select id="setor" required>
                    <option value="">Selecione o setor...</option>
                    <option value="RH">RH</option>
                    <option value="PEDAGÓGICO">PEDAGÓGICO</option>
                    <option value="PLATAFORMAS">PLATAFORMAS</option>
                    <option value="SERE">SERE</option>
                    <option value="PROTOCOLO">PROTOCOLO</option>
                    <option value="OUVIDORIA">OUVIDORIA</option>
                    <option value="FORMADORES">FORMADORES</option>
                    <option value="ED. ESPECIAL">ED. ESPECIAL</option>
                    <option value="ED. PROFISSIONAL">ED. PROFISSIONAL</option>
                    <option value="NCPM">NCPM</option>
                    <option value="EJA">EJA</option>
                    <option value="FINANCEIRO">FINANCEIRO</option>
                    <option value="ESTRUTURA">ESTRUTURA</option>
                    <option value="ENGENHEIROS">ENGENHEIROS</option>
                    <option value="TUTORIA">TUTORIA</option>
                    <option value="INFRA">INFRA</option>
                    <option value="NAS">NAS</option>
                    <option value="CPADS">CPADS</option>
                    <option value="EDH">EDH</option>
                    <option value="MÃOS AMIGAS">MÃOS AMIGAS</option>
                    <option value="EDIFICAÇÕES">EDIFICAÇÕES</option>
                    <option value="CRTE COMUNICAÇÃO">CRTE COMUNICAÇÃO</option>
                    <option value="CRTE PEDAGÓGICO">CRTE PEDAGÓGICO</option>
                    <option value="CHEFIA">CHEFIA</option>
                </select>
            </div>

            <div class="form-group">
                <label for="problema">Descrição do Problema:</label>
                <textarea id="problema" required placeholder="Descreva o que está acontecendo..."></textarea>
            </div>

            <button type="submit">Enviar Chamado</button>
        </form>

        <a href="admin.html" class="painel-link" target="_blank">Acessar Painel da TI (Restrito)</a>
    </div>

    <!-- Script Principal do Formulário e Estatísticas -->
    <script>
        // Função para carregar os contadores na tela inicial
        async function carregarEstatisticas() {
            try {
                const resposta = await fetch('/api/estatisticas');
                const stats = await resposta.json();
                
                document.getElementById('cardAberto').innerText = stats.Aberto || 0;
                document.getElementById('cardAndamento').innerText = stats['Em Andamento'] || 0;
                document.getElementById('cardFechado').innerText = stats.Fechado || 0;
                document.getElementById('cardCancelado').innerText = stats.Cancelado || 0;
            } catch (erro) {
                console.error('Erro ao carregar estatísticas:', erro);
            }
        }

        // Carrega ao abrir a página e atualiza a cada 30 segundos
        carregarEstatisticas();
        setInterval(carregarEstatisticas, 30000);

        // Envio do formulário de chamado
        document.getElementById('formChamado').addEventListener('submit', async function(e) {
            e.preventDefault();

            const dados = {
                nome: document.getElementById('nome').value,
                setor: document.getElementById('setor').value,
                problema: document.getElementById('problema').value
            };

            try {
                const resposta = await fetch('/api/chamados', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                if (resposta.ok) {
                    alert('Chamado aberto com sucesso!');
                    document.getElementById('formChamado').reset();
                    carregarEstatisticas(); // Atualiza os cards na hora
                } else {
                    alert('Erro ao abrir o chamado.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro de conexão com o servidor.');
            }
        });
    </script>

    <!-- Rodapé do Sistema -->
    <footer class="footer-sistema">
        <div class="footer-content">
            <p>Desenvolvido por <strong>Fernando Pereira Nilsen</strong></p>
            <p class="footer-version">Versão 1.1.0 &bull; 2026</p>
        </div>
    </footer>

    <!-- Botão flutuante para alternar o Dark Mode -->
    <button id="btn-dark-mode" onclick="alternarDarkMode()" title="Alternar Modo Escuro">🌙</button>

    <!-- Script do Dark Mode -->
    <script>
        // Função para alternar entre claro e escuro
        function alternarDarkMode() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            
            // Salva a preferência no navegador do usuário
            localStorage.setItem('darkMode', isDark);
            
            // Muda o ícone do botão
            const btn = document.getElementById('btn-dark-mode');
            btn.textContent = isDark ? '☀️' : '🌙';
        }

        // Ao carregar a página, verifica se o usuário já havia ativado o escuro antes
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('darkMode') === 'true') {
                document.body.classList.add('dark');
                const btn = document.getElementById('btn-dark-mode');
                if (btn) btn.textContent = '☀️';
            }
        });
    </script>
</body>
</html>
